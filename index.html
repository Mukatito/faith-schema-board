<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Картина — интерактивно</title>
<style>
  :root {
    --bg:#f4efe6; --ink:#1a2744; --card:#fffdf8; --line:#d2c4b0;
    --accent:#2f6f5e; --christ:#8b3a2b; --muted:#6b6358;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:1rem 1rem 0.4rem; max-width:960px; margin:0 auto; }
  h1 { font-size:1.2rem; margin:0 0 0.25rem; }
  .sub { color:var(--muted); font-size:0.9rem; margin:0; }
  .tabs { display:flex; gap:0.4rem; padding:0.6rem 1rem; max-width:960px; margin:0 auto; flex-wrap:wrap; }
  .tab { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:0.45rem 0.85rem; cursor:pointer; font-size:0.9rem; }
  .tab.active { background:var(--ink); color:#fff; border-color:var(--ink); }
  .layout { max-width:960px; margin:0 auto; padding:0.4rem 1rem 2rem; display:grid; gap:0.75rem; }
  @media (min-width:800px) { .layout { grid-template-columns: 240px 1fr; align-items:start; } }
  .rails { display:grid; gap:0.4rem; }
  .rail { text-align:left; border:1px solid var(--line); background:var(--card); border-radius:12px; padding:0.7rem 0.8rem; cursor:pointer; }
  .rail.selected { border-color:var(--accent); box-shadow:0 0 0 2px rgba(47,111,94,0.2); }
  .rail.christ { border-left:4px solid var(--christ); }
  .rail small { display:block; color:var(--muted); margin-top:0.2rem; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1rem; min-height:280px; }
  .panel h2 { margin:0 0 0.35rem; font-size:1.1rem; }
  .prio { font-size:0.85rem; color:var(--christ); font-weight:600; margin-bottom:0.6rem; }
  ul { margin:0; padding-left:1.1rem; }
  li { margin:0.35rem 0; }
  .mine { color:var(--accent); }
  .composer { display:grid; gap:0.45rem; margin-top:1rem; padding-top:0.8rem; border-top:1px dashed var(--line); }
  textarea { width:100%; min-height:72px; border:1px solid var(--line); border-radius:10px; padding:0.6rem; font:inherit; resize:vertical; }
  .row { display:flex; gap:0.4rem; flex-wrap:wrap; }
  button { border:0; border-radius:10px; padding:0.55rem 0.9rem; font:inherit; cursor:pointer; background:var(--accent); color:#fff; }
  button.secondary { background:#fff; color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  .hint { font-size:0.85rem; color:var(--muted); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Картина за приятелите — интерактивно</h1>
  <p class="sub">Играй: ред за приятели · твой приоритет · карти. Добавяй зелени редове. Запазва се в този телефон/браузер. Когато си готов — кажи на Миро; тогава съветниците.</p>
</header>

<div class="tabs">
  <button class="tab active" data-layer="present" type="button">1. Ред за приятели</button>
  <button class="tab" data-layer="priority" type="button">2. Твой приоритет</button>
  <button class="tab" data-layer="maps" type="button">3. Карти и метафори</button>
</div>

<div class="layout">
  <nav class="rails" id="rails"></nav>
  <article class="panel" id="panel">
    <p class="hint">Избери рафт вляво.</p>
  </article>
</div>

<script>
const DATA = {
  // Presentation order for friends (speak in this sequence). Christ stays last door, not first pitch.
  present: [
    {
      id: 'open',
      title: '1. Врата на масата',
      prio: 'Как почваш — без проповед',
      base: [
        'Кажи честно: аз съм приел Христос — това е моят дом',
        'Но днес няма да почна оттам: първо споделен свят и въпроси',
        'Обещание: няма да измислям числа; ще кажа „не знам“',
        'Три стаи: факти · философия/fittingness · вяра (отделно)'
      ]
    },
    {
      id: 'creation',
      title: '2. Сътворение / fittingness',
      prio: 'Кани към въпрос — не „доказва Бог“',
      base: [
        'T-прозорец · Rees · ДНК/код · белтъци · Милър–Юри + информация',
        'Goalposts от 1953 · ентропия честно · хомохиралност · тяло',
        'Антропен/мултивселена — назови; UNKNOWN дали се тества',
        'Битие: вода+Дух; суша; минерали=звезди — две колони',
        'Young V + степени на свобода (заворот ≠ кръстът)'
      ]
    },
    {
      id: 'archaeology',
      title: '3. Камък и време (в разрез с учебника)',
      prio: 'Факти + спорове — не сензация; колона „история/археология“',
      base: [
        'Гьобекли Тепе (~9600 г. пр.Хр.): монументално преди „класическото“ земеделие в старата учебна схема — мести разказа за „първо село, после храм“',
        'Пирамиди (Египет и др.): инженерство, дати, труд — какво е сигурно vs популярни митове',
        'Какво науката вече знае: стратиграфия, C14, контекст; какво остава отворено',
        'За масата: чудо на мащаба ≠ автоматично Библия; етикетирай колоната',
        'Не връзвай Гьобекли/пирамиди направо към Голгота — рима на „човекът е стар и сериозен“, не доказателство'
      ]
    },
    {
      id: 'ethics',
      title: '4. Как да живеем (покана)',
      prio: 'Преди кръста — животът, който Евангелието описва',
      base: [
        'Любов, прошка, врагове, пари, реч, милост',
        'Молитва · без лицемерие на „умните карти“',
        'Тук още не настояваш „приеми“ — показваш вкуса'
      ]
    },
    {
      id: 'prophecy',
      title: '5. Книгата сочи напред',
      prio: 'Покана, не съд — след fittingness',
      base: [
        'Михей 5:2 · Зах 9:9 · Исая 53 · Зах 12:10 · Пс 22 · Ер 31 · Давидова линия · Исая 40/Мал 3',
        'Етикети: Кир (спор за дата); Ос 11:1 = типология',
        'Подкрепя доверие в книгата — не замества кръст+възкресение'
      ]
    },
    {
      id: 'witness',
      title: '6. Свидетелства (втори ред)',
      prio: 'След книгата — не вместо',
      base: [
        'NDE · изцеления с изпитване · предсказания извън Библията — внимателно',
        'Не изместват кръста'
      ]
    },
    {
      id: 'forgot',
      title: '8. Бележник — спомени',
      prio: 'Тук пиши какво си спомниш по пътя. Миро после го слага в рафтовете.',
      base: [
        'Пирамидите и Гьобекли Тепе — вече в рафт 3',
        'Слот за забравеното: напиши го тук когато ти дойде'
      ]
    },
    {
      id: 'christ',
      title: '7. Христос — вратата в края',
      christ: true,
      prio: 'За теб №1 винаги. За приятелите — последната врата, след защита.',
      base: [
        'Съществувал и живял на Земята',
        'Умрял заради нашите грехове / грешки',
        'Възкръснал след три дни',
        'Тук казваш: това приех аз — каня ви, не ви съдя'
      ]
    }
  ],
  // Your inner shelf order (priority lock) — not the speak-order
  priority: [
    {
      id: 'p1',
      title: 'P1 — Христос (твоят дом)',
      christ: true,
      prio: 'Не се мести вътрешно. Пред приятели обаче не почваш оттук.',
      base: [
        'Живял · умрял за греховете · възкръснал',
        'Всичко друго е около това — за теб',
        'На масата: изяви това като последна врата, не като първи удар'
      ]
    },
    {
      id: 'p2',
      title: 'P2 — Етика на Евангелието',
      base: ['Как да живеем според Христос']
    },
    {
      id: 'p3',
      title: 'P3 — Сътворение / fittingness',
      base: ['Наука + Битие колони + Young']
    },
    {
      id: 'p4',
      title: 'P4 — Сравнителни карти',
      base: ['Щайнер · Дънов · метафори — именувани, не залепени']
    },
    {
      id: 'p5',
      title: 'P5 — Човешки свидетелства',
      base: ['NDE · изцеления · извънбиблейски — втори ред']
    }
  ],
  maps: [
    {
      id: 'young',
      title: 'Arthur Young — V',
      base: [
        'Светлина → частици → атоми → молекули (завой)',
        'Растения (време) → животни (пространство) → човек (смисъл)',
        'Заворот ≠ кръстът'
      ]
    },
    {
      id: 'steiner',
      title: 'Rudolf Steiner',
      base: [
        'Иерархии / жертва',
        'Свобода на Аза · Луцифер / Ариман',
        'Голгота като земно събитие',
        'Карма като възпитание — негова колона'
      ]
    },
    {
      id: 'danov',
      title: 'Петър Дънов',
      base: [
        'Живо Слово · любов–мъдрост–истина',
        'Школа · паневритмия',
        'Нова епоха — именувана, не залепена за Голгота'
      ]
    },
    {
      id: 'meta',
      title: 'Метафори',
      base: [
        'ECCO — навици (не кръщавай)',
        'Милиардер / гето — един живот',
        'Сфера + пирамида — Щайнер/твоя',
        'Сънуване / двойник — опит ≠ Свети Дух',
        'Орел — рима, не уравнение с Бог'
      ]
    },
    {
      id: 'rules',
      title: 'Правила на масата',
      base: [
        'Римувай практики',
        'Не залепвай шарнирите',
        'Именувай рафта на глас',
        'Празнина ≠ доказателство за Бог',
        'Приоритет ≠ ред на говорене'
      ]
    }
  ]
}

const storeKey = 'faith-schema-notes-v1';
const notes = JSON.parse(localStorage.getItem(storeKey) || '{}');
let layer = 'present';
let selected = null;

const rails = document.getElementById('rails');
const panel = document.getElementById('panel');

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    layer = t.dataset.layer;
    selected = null;
    renderRails();
    panel.innerHTML = '<p class="hint">Избери рафт.</p>';
  });
});

function save() {
  localStorage.setItem(storeKey, JSON.stringify(notes));
}

function renderRails() {
  rails.innerHTML = '';
  DATA[layer].forEach(item => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'rail' + (item.christ ? ' christ' : '') + (selected === item.id ? ' selected' : '');
    const extra = (notes[item.id] || []).length;
    btn.innerHTML = `<strong>${item.title}</strong><small>${extra ? extra + ' твои добавки' : 'базови точки'}</small>`;
    btn.addEventListener('click', () => {
      selected = item.id;
      renderRails();
      renderPanel(item);
    });
    rails.appendChild(btn);
  });
}

function renderPanel(item) {
  const mine = notes[item.id] || [];
  panel.innerHTML = `
    <h2>${item.title}</h2>
    ${item.prio ? `<div class="prio">${item.prio}</div>` : ''}
    <ul id="list">
      ${item.base.map(x => `<li>${x}</li>`).join('')}
      ${mine.map((x,i) => `<li class="mine">${escapeHtml(x)} <button type="button" class="secondary" data-del="${i}" style="padding:0.15rem 0.45rem;font-size:0.75rem;">×</button></li>`).join('')}
    </ul>
    <div class="composer">
      <label class="hint" for="add">Добави към този рафт</label>
      <textarea id="add" placeholder="Нова точка / спомен / въпрос…"></textarea>
      <div class="row">
        <button type="button" id="saveBtn">Добави</button>
        <button type="button" class="secondary" id="copyBtn">Копирай рафта</button>
        <button type="button" class="secondary" id="exportBtn">Копирай всички добавки</button>
      </div>
      <p class="hint">Зелените редове са твои. Кажи на Миро, когато искаш да влязат трайно в общата схема.</p>
    </div>
  `;
  panel.querySelector('#saveBtn').onclick = () => {
    const v = panel.querySelector('#add').value.trim();
    if (!v) return;
    notes[item.id] = notes[item.id] || [];
    notes[item.id].push(v);
    save();
    renderRails();
    renderPanel(item);
  };
  panel.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = () => {
      notes[item.id].splice(+b.dataset.del, 1);
      if (!notes[item.id].length) delete notes[item.id];
      save();
      renderRails();
      renderPanel(item);
    };
  });
  panel.querySelector('#copyBtn').onclick = async () => {
    const lines = [...item.base, ...(notes[item.id]||[])].map(x => '• ' + x).join('\n');
    await navigator.clipboard.writeText(item.title + '\n' + lines);
  };
  panel.querySelector('#exportBtn').onclick = async () => {
    await navigator.clipboard.writeText(JSON.stringify(notes, null, 2));
  };
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

renderRails();
</script>
</body>
</html>
